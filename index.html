<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Code Demo</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1rem;
        color: #1f2328;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.25rem;
      }
      p.subtitle {
        color: #59636e;
        margin-top: 0;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      textarea {
        width: 100%;
        min-height: 120px;
        padding: 0.5rem;
        font: inherit;
        border: 1px solid #d1d9e0;
        border-radius: 6px;
        box-sizing: border-box;
      }
      .counter {
        margin-top: 0.5rem;
        font-size: 0.875rem;
        color: #59636e;
      }
      .counter.over {
        color: #d1242f;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Claude Code Demo</h1>
    <p class="subtitle">A tiny page used to demonstrate automated PR review.</p>

    <label for="message">Your message</label>
    <textarea id="message" maxlength="500" aria-describedby="counter"></textarea>
    <div id="counter" class="counter" aria-live="polite">0 / 280 characters</div>

    <script>
      const LIMIT = 280;
      const input = document.getElementById('message');
      const counter = document.getElementById('counter');

      function updateCounter() {
        const length = input.value.length;
        counter.textContent = length + ' / ' + LIMIT + ' characters';
        counter.classList.toggle('over', length > LIMIT);
      }

      input.addEventListener('input', updateCounter);
      updateCounter();
    </script>
  </body>
</html>
